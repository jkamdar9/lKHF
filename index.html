<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaigaBots Robot Turntable</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #eef0f3;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: min(92vw, 90vh, 720px);
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
    cursor: grab;
    outline: none;
  }
  #stage.dragging { cursor: grabbing; }
  #stage:focus-visible { box-shadow: 0 0 0 2px #7a8493; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; font-size: 13px; color: #6b7280;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage" tabindex="0" role="img" aria-label="Robot turntable. Drag or swipe to spin. Arrow keys step one frame at a time.">
  <canvas id="c"></canvas>
</div>
<div id="hint">Drag or swipe to spin · arrow keys step through frames</div>

<script>
/* ---- Settings ---- */
const CONFIG = {
  frameCount: 180,          // frames robot_000 ... robot_179 (2 degrees apart, one full turn)
  folder: "frames",         // folder that holds the .webp files
  digits: 3,                // zero-padding: 000, 001, ...
  autoSpeed: 30,            // frames per second while auto-spinning (180 frames = 6 s per turn)
  easeRate: 2.2,            // how quickly speed eases toward the target (higher = snappier)
  idleResumeMs: 1500,       // pause before auto-spin resumes after you let go
  dragPxPerFrame: 5,        // how far you drag for one frame of movement
  wheelPxPerFrame: 6,       // horizontal scroll distance for one frame
  blend: true               // blend neighboring frames for sub-frame smoothness
};
/* ------------------ */

const N = CONFIG.frameCount;
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const frameUrl = i => `${CONFIG.folder}/robot_${String(i).padStart(CONFIG.digits, "0")}.webp`;
const images = new Array(N);
let loadedCount = 0;

for (let i = 0; i < N; i++) {
  const img = new Image();
  img.decoding = "async";
  img.onload = img.onerror = () => { loadedCount++; };
  img.src = frameUrl(i);
  images[i] = img;
}

/* State: pos is a fractional frame index in [0, N). */
let pos = 0;
let velocity = 0;          // frames per second
let dragging = false;
let lastInteract = -Infinity;
let drag = null;

const mod = (n, m) => ((n % m) + m) % m;
const ready = img => img && img.complete && img.naturalWidth > 0;

function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width * dpr));
  canvas.height = Math.max(1, Math.round(r.height * dpr));
  draw();
}
new ResizeObserver(resize).observe(stage);

function drawLoading() {
  const s = canvas.width;
  ctx.fillStyle = "#eef0f3";
  ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = "#6b7280";
  ctx.font = `${Math.round(s * 0.04)}px system-ui, sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(`Loading ${loadedCount} / ${N}`, s / 2, s / 2);
}

function draw() {
  if (!canvas.width) return;
  const a = images[Math.floor(pos)];
  if (!ready(a)) { drawLoading(); return; }
  const w = canvas.width, h = canvas.height;
  ctx.globalAlpha = 1;
  ctx.drawImage(a, 0, 0, w, h);
  const f = pos - Math.floor(pos);
  if (CONFIG.blend && f > 0.001) {
    const b = images[(Math.floor(pos) + 1) % N];
    if (ready(b)) {
      ctx.globalAlpha = f;
      ctx.drawImage(b, 0, 0, w, h);
      ctx.globalAlpha = 1;
    }
  }
}

/* Animation loop: velocity eases toward the target speed, so spinning, dragging and stopping all stay smooth. */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!dragging) {
    const idle = now - lastInteract > CONFIG.idleResumeMs;
    const target = (!reduceMotion && idle) ? CONFIG.autoSpeed : 0;
    velocity += (target - velocity) * (1 - Math.exp(-CONFIG.easeRate * dt));
    pos += velocity * dt;
  }
  pos = mod(pos, N);
  draw();
  requestAnimationFrame(tick);
}

/* Mouse / touch drag. Dragging right moves forward. Releasing while moving gives a short flick. */
stage.addEventListener("pointerdown", e => {
  dragging = true;
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
  const now = performance.now();
  drag = { x: e.clientX, t: now, v: 0 };
  velocity = 0;
  lastInteract = now;
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  const now = performance.now();
  const dx = e.clientX - drag.x;
  const dt = Math.max(1, now - drag.t) / 1000;
  const df = dx / CONFIG.dragPxPerFrame;
  pos += df;
  drag.v = 0.6 * drag.v + 0.4 * (df / dt);
  drag.x = e.clientX;
  drag.t = now;
  lastInteract = now;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  stage.classList.remove("dragging");
  const now = performance.now();
  velocity = (now - drag.t < 80) ? Math.max(-120, Math.min(120, drag.v)) : 0;
  lastInteract = now;
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* Horizontal scroll (trackpad) moves frames. */
stage.addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    e.preventDefault();
    pos += e.deltaX / CONFIG.wheelPxPerFrame;
    velocity = 0;
    lastInteract = performance.now();
  }
}, { passive: false });

/* Arrow keys step one frame. */
stage.addEventListener("keydown", e => {
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (step) {
    e.preventDefault();
    pos = mod(Math.round(pos) + step, N);
    velocity = 0;
    lastInteract = performance.now();
  }
});

resize();
requestAnimationFrame(tick);
</script>
</body>
</html>
